name: 견적 요청서 시제품 테스트
on:
  pull_request:
    paths:
      - 'prototype/**'
      - 'tests/quote-prototype.cjs'
      - 'tests/receipt-browser.cjs'
      - 'tests/comparison-preview.cjs'
      - '.github/workflows/quote-prototype.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/okclean-prototype.log 2>&1 &
      - run: node tests/quote-prototype.cjs
      - name: Receipt browser UI and loopback HTTPS checks
        run: node tests/receipt-browser.cjs
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/receipt-browser-evidence
      - name: Customer comparison preview checks
        run: node tests/comparison-preview.cjs
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/receipt-browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-browser-${{ github.sha }}
          path: ${{ runner.temp }}/receipt-browser-evidence
          if-no-files-found: ignore
          retention-days: 3
