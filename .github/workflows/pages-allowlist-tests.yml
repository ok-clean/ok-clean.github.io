name: Pages allowlist regression
on:
  pull_request:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/stage_pages.py . "$RUNNER_TEMP/okclean-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/okclean-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 --directory "$RUNNER_TEMP/okclean-pages" > /tmp/pages-http.log 2>&1 &
          node tests/pages_browser.cjs
