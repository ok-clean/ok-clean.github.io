name: 견적 변경 테스트
on:
  pull_request:
    paths:
      - 'app.js'
      - 'site.js'
      - 'style.css'
      - 'index.html'
      - 'config.json'
      - 'tests/**'
      - '.github/workflows/quote-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/estimate.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start local test server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/okclean-test-server.log 2>&1 &
      - run: node tests/browser-smoke.cjs
      - name: Save member screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-privacy-screens
          path: /tmp/okclean-member-privacy-*.png
          if-no-files-found: ignore
