name: Demo 복원 격리·체크포인트 연결 검사
on:
  pull_request:
    paths:
      - 'server/demo-restore-control.cjs'
      - 'server/demo-restore-replay.cjs'
      - 'server/independent-restore-verifier.cjs'
      - 'tests/demo-restore-control-emulator.cjs'
      - '.github/workflows/demo-restore-control.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock firebase-admin@12.7.0 firebase-tools@13.35.1
      - run: node tests/prepare-reservation-emulator.cjs
      - name: Synthetic control, checkpoint, replay and independent verifier chain
        run: npx firebase emulators:exec --project demo-okclean-integration --only firestore --config tests/fixtures/.reservation-e2e.json 'node tests/demo-restore-control-emulator.cjs'
