name: 회원가입 중지 규칙 에뮬레이터 검증
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'member-sync.js'
      - 'tests/member-signup-paused-rules.test.cjs'
      - 'tests/fixtures/member-signup-paused.test-only.rules'
      - 'tests/fixtures/firebase-member-paused.test-only.json'
      - '.github/workflows/member-paused-rules.yml'
permissions:
  contents: read
jobs:
  synthetic-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock firebase@10.14.1 @firebase/rules-unit-testing@3.0.4 firebase-tools@13.35.1
      - name: Synthetic Firestore rules in local emulator only
        run: npx firebase emulators:exec --project demo-okclean-member-paused --only firestore --config tests/fixtures/firebase-member-paused.test-only.json 'node --test tests/member-signup-paused-rules.test.cjs'
