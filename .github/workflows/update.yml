name: 사이트 자동 업데이트

on:
  schedule:
    - cron: "17 * * * *"   # 1시간마다 블로그 후기 확인
  workflow_dispatch:       # 수동 실행 버튼
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 블로그 후기 모으고 페이지 만들기
        run: python update.py

      - name: Pages 배포 파일 준비
        run: python scripts/stage_pages.py . "$RUNNER_TEMP/okclean-pages"

      - name: 바뀐 파일 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A . ':(exclude)__pycache__' ':(exclude)*.pyc'
          if ! git diff --cached --quiet; then
            git commit -m "사이트 자동 업데이트"
            # 원격에 새로운 변경이 있으면 덮어쓰지 않고 다음 실행에서 다시 생성합니다.
            git push
          fi
          # 변경사항이 없어 push하지 않은 경우에도 오래된 산출물 배포를 줄입니다.
          current="$(git rev-parse HEAD)"
          remote="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "$current" != "$remote" ]; then
            echo "main이 변경되어 이번 배포를 중단합니다."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/okclean-pages
      - id: deployment
        uses: actions/deploy-pages@v4

