name: 사이트 자동 업데이트

on:
  schedule:
    - cron: "17 * * * *"   # 1시간마다 블로그 후기 확인
  workflow_dispatch:       # 수동 실행 버튼
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 블로그 후기 모으고 페이지 만들기
        run: python update.py

      - name: 바뀐 파일 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A . ':(exclude)__pycache__' ':(exclude)*.pyc'
          if ! git diff --cached --quiet; then
            git commit -m "사이트 자동 업데이트"
            git push || (git pull --rebase -X theirs origin main && git push)
          fi

      - name: Pages 배포 파일 준비
        run: python scripts/stage_pages.py . "$RUNNER_TEMP/okclean-pages"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/okclean-pages
      - id: deployment
        uses: actions/deploy-pages@v4

