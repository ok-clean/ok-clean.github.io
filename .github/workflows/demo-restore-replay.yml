name: 격리 복원 재삭제 연결 검사
on:
  pull_request:
    paths:
      - 'server/demo-restore-replay.cjs'
      - 'server/deletion-ledger.cjs'
      - 'server/retention.cjs'
      - 'server/independent-restore-verifier.cjs'
      - 'tests/demo-restore-replay-emulator.cjs'
      - '.github/workflows/demo-restore-replay.yml'
permissions:
  contents: read
jobs:
  synthetic-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock firebase-admin@12.7.0 firebase-tools@13.35.1
      - run: node tests/prepare-reservation-emulator.cjs
      - run: node --test tests/deletion-ledger.test.cjs tests/retention.test.cjs tests/independent-restore-verifier.test.cjs
      - name: Synthetic replay on loopback emulators only
        run: npx firebase emulators:exec --project demo-okclean-integration --only auth,firestore --config tests/fixtures/.reservation-e2e.json 'node tests/demo-restore-replay-emulator.cjs'
        env:
          GCLOUD_PROJECT: demo-okclean-integration
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
