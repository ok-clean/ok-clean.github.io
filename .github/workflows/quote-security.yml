name: 견적 권한 에뮬레이터 테스트
on:
  pull_request:
    paths:
      - 'prototype/security/**'
      - '.github/workflows/quote-security.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node prototype/security/submission-controller.test.cjs
      - run: node prototype/security/matching-demo.test.cjs
      - run: node prototype/security/receipt-status-handler.test.cjs
      - run: node prototype/security/kst-date.test.cjs
      - run: npm install --no-save --no-package-lock firebase@10.14.1 @firebase/rules-unit-testing@3.0.4 firebase-tools@13.35.1
      - run: npx firebase emulators:exec --project demo-okclean-matching --only firestore --config prototype/security/firebase.json 'node prototype/security/rules.test.cjs'
