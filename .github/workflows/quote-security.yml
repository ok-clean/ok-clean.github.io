name: 견적 권한 에뮬레이터 테스트
on:
  pull_request:
    paths:
      - 'prototype/security/**'
      - '.github/workflows/quote-security.yml'
permissions:
  contents: read
concurrency:
  group: quote-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node prototype/security/submission-controller.test.cjs
      - run: node prototype/security/matching-demo.test.cjs
      - run: node prototype/security/receipt-status-handler.test.cjs
      - run: node prototype/security/receipt-http-adapter.test.cjs
      - run: node prototype/security/receipt-http-integration.test.cjs
      - name: Receipt resilience and client integration (35 regression tests)
        run: node --test prototype/security/receipt-resilience.test.cjs prototype/security/receipt-client.test.cjs
      - run: node prototype/security/kst-date.test.cjs
      - run: node --test prototype/security/comparison-transport.test.cjs
      - run: node --test prototype/security/request-cancel-handler.test.cjs
      - run: npm install --no-save --no-package-lock firebase@10.14.1 @firebase/rules-unit-testing@3.0.4 firebase-tools@13.35.1 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Firestore request regression and partner grant lifecycle
        run: npx firebase emulators:exec --project demo-okclean-matching --only firestore --config prototype/security/firebase.json 'node prototype/security/rules.test.cjs && node --test prototype/security/partner-matching.test.cjs && node --test prototype/security/comparison.test.cjs && node prototype/security/comparison-browser.test.cjs && node --test prototype/security/request-cancel.test.cjs'
