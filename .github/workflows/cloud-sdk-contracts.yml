name: 실제 SDK 연결 계약 검사
on:
  pull_request:
    paths:
      - 'server/**'
      - 'tests/*provider*'
      - 'tests/firebase-sdk-identity.test.cjs'
      - 'tests/gcp-readonly-inspector.test.cjs'
      - '.github/workflows/cloud-sdk-contracts.yml'
      - 'docs/operations-approval-plan.md'
permissions:
  contents: read
jobs:
  sdk-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: SDK requests, response integrity and default write denial
        run: node --test tests/firebase-sdk-identity.test.cjs tests/gcp-readonly-inspector.test.cjs tests/gcp-kms-provider.test.cjs tests/firestore-write-provider.test.cjs tests/firestore-evidence-provider.test.cjs tests/gcs-checkpoint-provider.test.cjs
  firestore-sdk-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --no-package-lock firebase-tools@13.35.1
      - name: Locked SDK atomic writes and evidence with synthetic loopback data
        env:
          GCLOUD_PROJECT: demo-write-provider
        run: npx firebase emulators:exec --project demo-write-provider --only firestore --config tests/sdk-provider-emulator.json 'node tests/firestore-write-provider-emulator.cjs && node tests/firestore-evidence-provider-emulator.cjs'
