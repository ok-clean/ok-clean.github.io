name: 예약 모바일·PC 격리 흐름
on:
  pull_request:
    paths:
      - 'tests/reservation-browser-emulator.cjs'
      - '.github/workflows/reservation-viewport-tests.yml'
permissions:
  contents: read
jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [320, 390, 1440]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock firebase@10.14.1 firebase-admin@12.7.0 firebase-tools@13.35.1 playwright@1.56.1 esbuild@0.25.12
      - run: npx playwright install --with-deps chromium
      - run: npx esbuild tests/firebase-browser-entry.js --bundle --format=esm --platform=browser --outfile=/tmp/okclean-firebase-bundle.js
      - run: node tests/prepare-reservation-emulator.cjs
      - name: Synthetic booking, access isolation and admin state
        run: npx firebase emulators:exec --project demo-okclean-integration --only auth,firestore --config tests/fixtures/.reservation-e2e.json 'node tests/reservation-browser-emulator.cjs'
        env:
          OKCLEAN_TEST_VIEWPORT_WIDTH: ${{ matrix.width }}
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          GCLOUD_PROJECT: demo-okclean-integration
