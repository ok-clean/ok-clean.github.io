<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>견적 요청 관리 연습 | 오케이청소</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#1d3150;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:1.7rem}p{line-height:1.6}.notice{background:#fff4d9;border-radius:12px;padding:14px}.card{background:#fff;border:1px solid #d6e1ef;border-radius:14px;margin:14px 0;padding:18px}.meta{display:flex;flex-wrap:wrap;gap:8px;color:#405473}.badge{background:#e6efff;padding:4px 9px;border-radius:20px;font-weight:700}label{display:block;margin:14px 0 7px;font-weight:700}select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #b8cbe3;background:white;color:inherit}select{width:100%}button{background:#174cb4;color:white;border:0;font-weight:700;width:100%;margin-top:12px}button:focus-visible,select:focus-visible{outline:3px solid #f3ad24;outline-offset:2px}.sr{color:#245387}small{color:#526980}
</style></head><body><main><strong>오케이청소</strong><h1>견적 요청 관리</h1><p class="notice"><b>관리 화면 연습용 시제품</b><br>모두 가상 요청입니다. 로그인·보안·서버 저장이 연결되지 않았으며 변경 내용은 새로고침하면 초기화됩니다.</p><p>요청을 확인하고 처리 방법과 상태를 선택해 보세요.</p><p class="notice">업체 승인·배정·견적 비교 기능은 별도 로컬 테스트 코드에만 있습니다. 이 관리 화면은 실제 업체 인증이나 고객 요청 저장 기능과 연결되지 않습니다.</p><section id="requests" aria-label="가상 견적 요청 목록"></section><p id="message" role="status" aria-live="polite"></p></main><script>
const rows=[{id:'demo-1',service:'입주·이사 청소',area:'춘천',size:25,date:'가상 일정',status:'신규',route:'미정'},{id:'demo-2',service:'에어컨 청소',area:'홍천',size:1,date:'가상 일정',status:'신규',route:'미정'}];
const root=document.getElementById('requests');
for(const row of rows){const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="meta"><span class="badge">${row.status}</span><strong>${row.service}</strong><span>${row.area}</span></div><p>규모: ${row.size} · 희망일: ${row.date}</p><label for="route-${row.id}">처리 방법</label><select id="route-${row.id}" class="route"><option>미정</option><option>직접 시공 검토</option><option>제휴업체 연결 검토</option></select><label for="status-${row.id}">진행 상태</label><select id="status-${row.id}" class="status"><option>신규</option><option>검토중</option><option>상담중</option><option>예약확정</option><option>작업완료</option><option>종료</option></select><button type="button">연습 내용 적용</button><small>실제 업체나 고객에게 전달되지 않습니다.</small>`;
 card.querySelector('button').addEventListener('click',()=>{row.status=card.querySelector('.status').value;row.route=card.querySelector('.route').value;card.querySelector('.badge').textContent=row.status;document.getElementById('message').textContent=`${row.area} 가상 요청: ${row.route} / ${row.status} (화면에서만 적용)`});root.appendChild(card);}
</script></body></html>
