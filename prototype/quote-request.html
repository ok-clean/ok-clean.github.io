<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>청소 견적 요청 연습 화면 | 오케이청소</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172b4d;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:0 auto;padding:24px 16px 48px}.brand{font-weight:800;color:#1644a6}.notice{border-radius:12px;background:#eaf1ff;padding:14px;line-height:1.6;color:#153d80}h1{font-size:1.8rem;margin:24px 0 8px}p{line-height:1.6}form,.result{background:white;border:1px solid #dbe4f0;border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 5px 20px #19385a0a}label{display:block;font-weight:700;margin:18px 0 8px}select,input,textarea,button{width:100%;font:inherit;border:1px solid #b6c6dc;border-radius:10px;padding:12px;background:white;color:inherit}textarea{resize:vertical;min-height:88px}button{background:#174cb4;color:white;border:0;font-weight:700;cursor:pointer;margin-top:20px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffba31;outline-offset:2px}.photo-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.photo-preview img{width:96px;height:96px;object-fit:cover;border-radius:8px}.error{color:#b42318}.sub{color:#50627b;font-size:.93rem}.result dl{display:grid;grid-template-columns:96px 1fr;gap:12px;margin:0}.result dt{font-weight:700}.result dd{margin:0;overflow-wrap:anywhere}[hidden]{display:none!important}
</style>
</head><body><main>
<a class="brand" href="../index.html">오케이청소</a>
<h1>청소 견적 요청</h1>
<p>필요한 청소와 희망 일정을 알려주세요.</p>
<p class="notice"><strong>테스트 화면입니다.</strong> 입력 내용은 업체나 관리자에게 전송·저장되지 않습니다. 연락처·상세 주소와 같은 개인정보는 입력하지 마세요.</p>
<form id="quote" novalidate>
<label for="service">청소 종류</label>
<select id="service" required><option value="">선택해 주세요</option><option>입주·이사 청소</option><option>거주·정기 청소</option><option>사무실·상가 청소</option><option>에어컨 청소</option><option>후드·주방 청소</option><option>그 외 청소</option></select>
<label for="area">지역</label>
<select id="area" required><option value="">선택해 주세요</option><option>춘천</option><option>화천</option><option>양구</option><option>인제</option><option>철원</option><option>홍천</option><option>횡성</option><option>가평</option><option>그 외 지역</option></select>
<label for="size">청소 면적 (평)</label><input id="size" type="number" min="1" max="999" inputmode="numeric" step="1" required placeholder="예: 25">
<label for="date">희망 날짜</label><input id="date" type="date" required>
<label for="photos">현장 사진 미리보기 (선택)</label>
<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple aria-describedby="photo-help photo-error">
<p class="sub" id="photo-help">최대 3장, 각 5MB 이하의 JPG·PNG·WebP 사진을 선택할 수 있어요. 이 기기에서만 보이며 저장되거나 전송되지 않습니다.</p>
<p class="error" id="photo-error" role="alert"></p>
<div class="photo-preview" id="photo-preview"></div>
<p class="sub">사진 업로드와 관리자 접수는 추후 안전한 저장 기능을 마련한 뒤 연결합니다.</p>
<p class="error" id="error" role="alert" aria-live="polite"></p>
<button type="submit">입력 내용 확인</button>
</form>
<section class="result" id="result" hidden aria-labelledby="result-title" tabindex="-1"><h2 id="result-title">입력 내용</h2><dl><dt>청소 종류</dt><dd id="r-service"></dd><dt>지역</dt><dd id="r-area"></dd><dt>면적</dt><dd id="r-size"></dd><dt>희망 날짜</dt><dd id="r-date"></dd></dl><p class="sub">이 화면은 요청서를 전송하지 않습니다.</p></section>
</main><script>
const $ = id => document.getElementById(id);
const kstToday = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0,10);
$('date').min = kstToday();
let photoUrls = [];
$('photos').addEventListener('change', e => {
 for(const url of photoUrls) URL.revokeObjectURL(url);
 photoUrls = []; $('photo-preview').replaceChildren(); $('photo-error').textContent = '';
 const files = [...e.target.files];
 if(files.length > 3 || files.some(file => !['image/jpeg','image/png','image/webp'].includes(file.type) || file.size > 5*1024*1024)) {
  e.target.value = ''; $('photo-error').textContent = 'JPG·PNG·WebP 사진을 각 5MB 이하로 최대 3장 선택해 주세요.'; return;
 }
 for(const file of files) {
  const url = URL.createObjectURL(file); photoUrls.push(url);
  const img = document.createElement('img'); img.alt = '선택한 현장 사진 미리보기'; img.src = url; $('photo-preview').appendChild(img);
 }
});
$('quote').addEventListener('submit', e => {
 e.preventDefault(); const service=$('service'), area=$('area'), size=$('size'), date=$('date');
 const checks=[[service, '청소 종류를 선택해 주세요.'],[area, '지역을 선택해 주세요.'],[size, '면적을 1~999평의 정수로 입력해 주세요.'],[date, '오늘 이후 희망 날짜를 선택해 주세요.']];
 date.min=kstToday();
 for(const [el,msg] of checks){if(!el.checkValidity()){ $('error').textContent=msg; $('result').hidden=true; el.focus(); return; }}
 $('error').textContent=''; for(const [id,value] of [['service',service.value],['area',area.value],['size',size.value+'평'],['date',date.value]]) $('r-'+id).textContent=value;
 $('result').hidden=false; $('result').focus();
});
</script></body></html>
