<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d87"><title>오케이청소 관리자</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="../icon-192.png"><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#172a46;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:18px 14px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:21px}h2{font-size:17px}.muted{color:#64748b;font-size:13px}.card{background:white;border:1px solid #e1e7f0;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #172a4608}button,select,input,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd5e1;background:white;max-width:100%}button{cursor:pointer}button.primary{background:#173d87;color:white;border-color:#173d87;font-weight:700}button:disabled{opacity:.5}input[type=search]{width:100%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{text-align:center;background:white;border:1px solid #e1e7f0;border-radius:12px;padding:12px 4px}.stat b{display:block;font-size:23px;color:#173d87}.stat span{font-size:12px;color:#64748b}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1}.person{border-bottom:1px solid #e8edf4;padding:12px 0}.person:last-child{border:0}.person summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}.person summary::-webkit-details-marker{display:none}.name{font-weight:700}.pill{font-size:11px;border-radius:30px;padding:4px 7px;background:#e9f0ff;color:#173d87}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.fields label{font-size:12px;color:#53647c}.fields label>*{display:block;width:100%;margin-top:4px}.fields .wide{grid-column:1/-1}.danger{color:#ad2626}#login{max-width:450px;margin:70px auto}#message{white-space:pre-wrap}.hide{display:none!important}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.fields .wide{grid-column:auto}h1{font-size:18px}}
</style></head><body><main><header><h1>🧹 오케이청소 관리자</h1><button id="logout" hidden>로그아웃</button></header><p class="muted">회원·쿠폰·무료서비스·상담 현황을 한곳에서 관리합니다.</p><div id="message" role="status" class="muted"></div>
<section id="login" class="card"><h2>관리자 로그인</h2><p class="muted">허가된 관리자 Google 계정만 회원정보를 볼 수 있습니다.</p><button class="primary" id="loginBtn">Google 계정으로 로그인</button><p class="muted">처음 설치할 때 Firebase 설정 및 관리자 UID 등록이 필요합니다.</p></section>
<section id="dashboard" hidden><div class="grid" id="stats"></div><div class="card"><div class="toolbar"><input id="search" type="search" placeholder="이름·전화번호·지역·쿠폰번호 검색" aria-label="회원 검색"><select id="statusFilter" aria-label="상담 상태"><option value="">전체 상태</option><option>신규</option><option>상담중</option><option>예약확정</option><option>작업완료</option><option>종료</option></select></div><p class="muted">회원 정보는 로그인한 관리자에게만 표시됩니다. 상담·쿠폰 변경은 저장 버튼을 누르세요.</p><div id="members"></div></div></section>
<section id="reservationDashboard" class="card" hidden><h2>예약 관리 · 시험</h2><p class="muted">로컬 시험 데이터입니다.</p><div id="reservationMessage" role="status"></div><div id="reservationList"></div></section>
</main><script type="module" src="admin.js"></script></body></html>
